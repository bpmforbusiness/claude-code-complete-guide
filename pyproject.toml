[project]
name = "todo-api"
version = "0.1.0"
description = "Demo Python to-do API for the Claude Code tutorial video"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
]

[project.optional-dependencies]
api = ["uvicorn>=0.30.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]