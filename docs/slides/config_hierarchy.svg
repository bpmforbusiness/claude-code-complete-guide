<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="110" text-anchor="middle" font-family="Segoe UI, Arial" font-size="56" font-weight="700" fill="#e6edf3">CONFIG HIERARCHY</text>
  <text x="800" y="170" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" fill="#8b949e">Three CLAUDE.md levels — additive, each extends the one below</text><rect x="250" y="260" width="1100" height="130" rx="18" fill="#1f6feb" opacity="0.92"/>
  <text x="800.0" y="315.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#fff">3. LOCAL  (lazy-loaded)</text>
  <text x="800.0" y="365.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" fill="#d0d7de">.claude/settings.local.json — overrides team</text><rect x="250" y="430" width="1100" height="130" rx="18" fill="#d29922" opacity="0.92"/>
  <text x="800.0" y="485.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#fff">2. TEAM</text>
  <text x="800.0" y="535.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" fill="#d0d7de">myrepo/CLAUDE.md — project-wide conventions</text><rect x="250" y="600" width="1100" height="130" rx="18" fill="#3fb950" opacity="0.92"/>
  <text x="800.0" y="655.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#fff">1. USER</text>
  <text x="800.0" y="705.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" fill="#d0d7de">~/.claude/CLAUDE.md — personal rules, all projects</text><text x="800" y="860" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" fill="#8b949e">Directory-level #3 loads ON DEMAND only when Claude touches that subtree → lean context</text></svg>